<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#050611">
		<meta
			name="description"
			content="Play TINYNOID, a compact browser paddle-breaker with 33 stages, eight capsules, global high scores, and community levels."
		>
		<link rel="canonical" href="https://tinynoid.vercel.app/">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="TINYNOID">
		<meta property="og:url" content="https://tinynoid.vercel.app/">
		<meta property="og:title" content="TINYNOID &mdash; A TINY TRIBUTE ARKANOID TRIBUTE BY ADRIAN MATO">
		<meta
			property="og:description"
			content="Clear 33 stages, collect eight game-changing capsules, chase global high scores, and play community-built levels."
		>
		<meta property="og:image" content="https://tinynoid.vercel.app/og-image.png">
		<meta property="og:image:type" content="image/png">
		<meta property="og:image:width" content="1200">
		<meta property="og:image:height" content="630">
		<meta
			property="og:image:alt"
			content="TINYNOID title beside its colorful Stage 1 brick layout."
		>
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="TINYNOID &mdash; A TINY TRIBUTE ARKANOID TRIBUTE BY ADRIAN MATO">
		<meta
			name="twitter:description"
			content="Clear 33 stages, collect eight capsules, chase global high scores, and play community-built levels."
		>
		<meta name="twitter:image" content="https://tinynoid.vercel.app/og-image.png">
		<meta
			name="twitter:image:alt"
			content="TINYNOID title beside its colorful Stage 1 brick layout."
		>
		<title>TINYNOID &mdash; A TINY TRIBUTE ARKANOID TRIBUTE BY ADRIAN MATO</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #f7f4ff;
	background: #050611;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #050611;
	font: 14px Arial, sans-serif;
}

#status-progress {
	width: min(320px, 60vw);
}

#status-notice {
	display: none;
	max-width: 40rem;
	padding: 1rem;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>
		<div id="status">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		<script src="$GODOT_URL"></script>
		<script>
const engine = new Engine($GODOT_CONFIG);
const status = document.getElementById("status");
const progress = document.getElementById("status-progress");
const notice = document.getElementById("status-notice");

engine.startGame({
	onProgress(current, total) {
		if (current > 0 && total > 0) {
			progress.value = current;
			progress.max = total;
		} else {
			progress.removeAttribute("value");
		}
	},
}).then(() => {
	status.remove();
}, (error) => {
	console.error(error);
	progress.style.display = "none";
	notice.style.display = "block";
	notice.textContent = error instanceof Error
		? error.message
		: "TINYNOID could not start.";
});
		</script>
	</body>
</html>
