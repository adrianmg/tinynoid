<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #050611;
    }
    body {
      position: relative;
      color: #f7f4ff;
      text-transform: uppercase;
    }
    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #6d83f2;
    }
    .star.cyan { background: #74ddff; }
    .star.white { background: #f7f4ff; }
    .shell {
      position: absolute;
      inset: 28px;
      border: 4px solid #287fc4;
      box-shadow: 10px 10px 0 #12345b;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: #74ddff;
    }
    .copy {
      position: absolute;
      left: 66px;
      top: 76px;
      width: 500px;
    }
    .brand {
      margin: 0;
      color: #74ddff;
    }
    .kicker {
      margin-top: 26px;
      color: #c967e8;
    }
    .rule {
      width: 460px;
      height: 8px;
      margin: 30px 0;
      border-top: 3px solid #74ddff;
      border-bottom: 3px solid #287fc4;
    }
    .facts {
      margin: 42px 0 0;
      color: #ffd84a;
    }
    .play {
      display: inline-block;
      margin-top: 28px;
      padding: 13px 18px 11px;
      border: 3px solid #74ddff;
      color: #050611;
      background: #74ddff;
      box-shadow: 6px 6px 0 #287fc4;
    }
    .screen {
      position: absolute;
      top: 48px;
      right: 38px;
      width: 577px;
      height: 534px;
      overflow: hidden;
      border: 8px solid #287fc4;
      border-top-color: #74ddff;
      border-bottom: 0;
      background: #050611;
      box-shadow: 10px 10px 0 #12345b;
    }
    .screen img {
      width: 561px;
      height: 526px;
      image-rendering: pixelated;
    }
    .brick-row {
      display: flex;
      gap: 8px;
      margin-top: 32px;
    }
    .brick {
      width: 42px;
      height: 16px;
      border: 3px solid #111329;
      box-shadow: inset 0 3px #f7f4ff, inset 0 -3px #12345b;
    }
  </style>
</head>
<body>
  <span class="star white" style="left:44px;top:52px"></span>
  <span class="star cyan" style="left:582px;top:42px"></span>
  <span class="star" style="left:542px;top:560px"></span>
  <span class="star white" style="left:1150px;top:590px"></span>
  <div class="shell"></div>
  <main class="copy">
    <p
      class="brand"
      data-pixel
      data-text="TINYNOID"
      data-scale="13"
      data-color="#74ddff"
      data-shadow="8,8,#287fc4"
    ></p>
    <p
      class="kicker"
      data-pixel
      data-text="A TINY ARKANOID TRIBUTE"
      data-scale="4"
      data-color="#c967e8"
    ></p>
    <div class="rule"></div>
    <p
      class="facts"
      data-pixel
      data-text="33 STAGES / 8 CAPSULES|GLOBAL HIGH SCORES"
      data-scale="4"
      data-line-gap="10"
      data-color="#ffd84a"
    ></p>
    <span
      class="play"
      data-pixel
      data-text="PLAY IN YOUR BROWSER"
      data-scale="4"
      data-color="#050611"
    ></span>
    <div class="brick-row" aria-hidden="true">
      <span class="brick" style="background:#f15b68"></span>
      <span class="brick" style="background:#ff8a3d"></span>
      <span class="brick" style="background:#56d46f"></span>
      <span class="brick" style="background:#6d83f2"></span>
      <span class="brick" style="background:#c967e8"></span>
      <span class="brick" style="background:#ffd84a"></span>
    </div>
  </main>
  <figure class="screen">
    <img src="/docs/screenshots/stage-01.png" alt="">
  </figure>
  <script src="/web/social/pixel-font.js"></script>
</body>
</html>
