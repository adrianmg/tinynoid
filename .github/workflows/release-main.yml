name: Release main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and export
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Cache Godot editor and templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .ci/godot
            ~/.local/share/godot/export_templates/4.7.2-stable
          key: godot-standard-4.7.2-linux-v1

      - name: Install verified Godot tools
        run: .github/scripts/setup-godot.sh

      - name: Build release archives
        run: .github/scripts/build-release.sh

      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*

      - name: Upload release handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download release handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dist
          path: dist/

      - name: Publish or repair release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh dist

      - name: Retain newest 30 main releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_COUNT: 30
        run: .github/scripts/prune-main-releases.sh

      - name: Write release summary
        run: |
          {
            echo "## TINYNOID release"
            echo
            echo "- Tag: \`${{ steps.publish.outputs.tag }}\`"
            echo "- URL: ${{ steps.publish.outputs.url }}"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: Report release failure
    needs: [build, release]
    if: >-
      ${{
        always()
        && (
          needs.build.result == 'failure'
          || needs.release.result == 'failure'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout failure reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-release-failure.sh
