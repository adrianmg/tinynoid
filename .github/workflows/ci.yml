name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Godot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache Godot editor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .ci/godot
          key: godot-standard-editor-4.7.2-linux-v1

      - name: Install verified Godot tools
        env:
          GODOT_INSTALL_TEMPLATES: 0
        run: .github/scripts/setup-godot.sh

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Import project
        run: '"$GODOT_BIN" --headless --editor --path godot --quit'

      - name: Run test suite
        run: '"$GODOT_BIN" --headless --path godot res://tests/test_runner.tscn'

      - name: Test community editor
        run: node --test web/tests/*.test.mjs

      - name: Test Supabase functions
        run: |
          deno fmt --check \
            supabase/functions/_shared \
            supabase/functions/community-levels \
            supabase/functions/daily-challenge \
            supabase/functions/share-level \
            supabase/functions/start-run \
            supabase/functions/start-daily-run \
            supabase/functions/submit-level \
            supabase/functions/submit-daily-score \
            supabase/functions/submit-score
          deno check \
            supabase/functions/community-levels/index.ts \
            supabase/functions/daily-challenge/index.ts \
            supabase/functions/share-level/index.ts \
            supabase/functions/start-run/index.ts \
            supabase/functions/start-daily-run/index.ts \
            supabase/functions/submit-level/index.ts \
            supabase/functions/submit-daily-score/index.ts \
            supabase/functions/submit-score/index.ts
          deno test supabase/functions/_shared/*_test.ts

      - name: Validate Web preset
        run: |
          "$GODOT_BIN" --headless --quiet --path godot \
            --export-pack Web /tmp/tinynoid.pck
          test -s /tmp/tinynoid.pck
